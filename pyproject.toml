[project]
name = "python-backend-template"
version = "0.1.0"
description = "Minimal modular FastAPI infrastructure for commercial projects"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<2.2", "asyncpg>=0.30,<1", "alembic>=1.14,<2",
  "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1", "pyjwt[crypto]>=2.10,<3",
]

[dependency-groups]
dev = [
  "ruff>=0.9", "pyright>=1.1", "pytest>=8", "pytest-asyncio>=0.25",
  "asgi-lifespan>=2.1", "openapi-spec-validator>=0.7", "pip-audit>=2.8",
  "lefthook>=1.10", "pyyaml>=6", "bandit>=1.8",
]

[project.scripts]
project-init = "myapp.cli:init_project"
export-openapi = "myapp.cli:export_openapi"
project-migration = "myapp.cli:make_migration"
project-job = "myapp.jobs.cli:main"
project-check = "myapp.checks:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myapp"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["src", "tests", "migrations", "scripts"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires an isolated PostgreSQL database"]
